[project]
name = "stepcheck"
version = "0.1.0"
description = "Check every step of a worked maths solution with SymPy."
readme = "README.md"
authors = [
    { name = "hugo-chu", email = "th.hugo.chu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime==4.11.0",
    "latex2sympy2-extended[antlr4-11-0]==1.11.0",
    "pydantic>=2.14.3",
    "sympy==1.14.0",
]

[project.scripts]
stepcheck = "stepcheck.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules -p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]  # tests import shared helpers such as `strategies`
typeCheckingMode = "standard"
