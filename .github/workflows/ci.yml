name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Test
        run: uv run pytest
      - name: Try the CLI on the examples
        # Each example has a deliberate mistake, so exit status 1 is the expected result.
        run: |
          for file in examples/*.tex; do
            echo "== $file"
            if uv run stepcheck check "$file"; then
              echo "expected a wrong line in $file"; exit 1
            fi
          done
